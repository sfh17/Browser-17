<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- the browser's own look is never repainted by Dark 17 (Chromium's automatic dark mode is for sites) -->
<meta name="color-scheme" content="only light">
<title>Player-17 Browser</title>
<style>
:root { --bg: #000000; --text: #0a84ff; --title: #ffffff; --lines: #ff0080; --frame: #ff0080;
  --ease: cubic-bezier(0.22, 1, 0.36, 1); --t: 210ms; }
/* Electron's corner smoothing: rounded corners flow into the straight edges (like Blender's
   Bevel or Apple's squircles) instead of a plain quarter circle. */
* { box-sizing: border-box; -electron-corner-smoothing: 70%; }
/* Edges as smooth as possible without making a line thicker: the line icons and text are drawn
   with full-quality antialiasing (no rounding of their points to whole pixels). */
html { text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
svg, svg * { shape-rendering: geometricPrecision; }
/* Corners that sit inside one another follow one another: inner radius = outer radius minus the
   gap between them (an island 14px with 6px inside -> its rows 8px). The page area sits in the
   window's own corner, which the system draws as a plain circle: there the radius is the
   window's minus the 6px margin, and no smoothing, so both curves run side by side. */
:root { --win-r: 15px; --gap: 6px; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
  font-family: Cantarell, "Noto Sans", sans-serif; font-size: 14px; user-select: none; }
#root { display: flex; flex-direction: column; height: 100%; position: relative; }

/* the header: drag it to move the window (double click: maximize) */
header { display: flex; align-items: center; gap: 4px; padding: 8px 10px; -webkit-app-region: drag; }
header button, header input { -webkit-app-region: no-drag; }
.space { flex: 1; min-width: 10px; }
/* the pink dot as far from the left edge as from the top (16.5 px), like in the player */
#dots { display: flex; gap: 4px; margin-right: 10px; margin-left: 4.5px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 0; padding: 0; margin: 0 2px; cursor: pointer;
  display: grid; place-items: center; }
.dot svg { width: 10px; height: 10px; fill: none; stroke: rgba(0, 0, 0, 0.65); stroke-width: 2.6;
  stroke-linecap: round; opacity: 0; transition: opacity 150ms; }
#dots:hover .dot svg { opacity: 1; }
.btn { background: transparent; border: 0; border-radius: 9px; padding: 5px; color: var(--text); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font: inherit; }
.btn:hover { background: color-mix(in srgb, var(--text) 12%, transparent); }
.btn:active { background: color-mix(in srgb, var(--text) 22%, transparent); }
.btn:hover svg { stroke: var(--lines); }
.btn:disabled { opacity: 0.35; cursor: default; background: transparent; }
.btn:disabled svg { stroke: var(--text); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: var(--text); stroke-width: 1.9;
  stroke-linecap: round; stroke-linejoin: round; transition: stroke 120ms; }
#address { flex: 6; max-width: 760px; min-width: 120px; background: color-mix(in srgb, var(--text) 10%, transparent);
  color: var(--text); border: 1px solid var(--lines); border-bottom-width: 2px; border-radius: 0;
  padding: 6px 10px; font: inherit; outline: none; user-select: text; }
#address::placeholder { color: color-mix(in srgb, var(--text) 55%, transparent); }
#address::selection { background: var(--lines); color: #fff; }
.pill { border: 1px solid color-mix(in srgb, var(--text) 35%, transparent); border-radius: 14px;
  padding: 4px 12px 4px 8px; font-weight: 600; }
.pill:hover { border-color: var(--lines); }
.sep { width: 1px; align-self: stretch; margin: 7px 6px; background: color-mix(in srgb, var(--text) 18%, transparent); }
#volume { -webkit-app-region: no-drag; appearance: none; width: 90px; height: 4px; border-radius: 2px; cursor: pointer;
  background: linear-gradient(var(--text), var(--text)) 0 / var(--fill, 100%) 100% no-repeat,
              color-mix(in srgb, var(--text) 25%, transparent); }
#volume::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
#volume:disabled { opacity: 0.4; cursor: default; }

/* tabs: a frame like the address field; the ones in the background are dimmed evenly */
#tabbar { display: flex; gap: 6px; align-items: center; padding: 0 12px 8px; overflow: hidden; max-height: 44px;
  transition: max-height var(--t) var(--ease), padding var(--t) var(--ease), opacity var(--t) var(--ease);
  -webkit-app-region: drag; }
#tabbar.hidden { max-height: 0; padding-bottom: 0; opacity: 0; }
#tabbar button, .tab { -webkit-app-region: no-drag; }
#tabs { display: flex; gap: 6px; min-width: 0; flex: 0 1 auto; }
.tab { display: flex; align-items: center; gap: 6px; flex: 0 1 200px; min-width: 56px; max-width: 230px;
  padding: 3px 3px 3px 8px; background: color-mix(in srgb, var(--text) 10%, transparent);
  border: 1px solid var(--lines); border-bottom-width: 2px; opacity: 0.42; cursor: pointer;
  transition: opacity 200ms; }
.tab.active { opacity: 1; }
.tab img { width: 16px; height: 16px; }
.tab .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab .btn { padding: 2px; border-radius: 4px; }
.tab .btn svg { width: 13px; height: 13px; }
/* a pinned tab: only its icon (or first letter), always on the left, no close cross;
   it opens again with the browser and Ctrl+W / middle click leave it alone */
.tab .letter { display: none; width: 16px; text-align: center; font-weight: 700; font-size: 12px; color: var(--title); }
.tab.pinned { flex: none; min-width: 0; width: 38px; padding: 3px; justify-content: center; }
.tab.pinned .name, .tab.pinned .btn { display: none; }
.tab.pinned.noicon .letter { display: block; }

#load { height: 2px; }
#load.on { background: linear-gradient(90deg, transparent, var(--lines), transparent) no-repeat;
  background-size: 40% 100%; animation: load 1.1s linear infinite; }
@keyframes load { from { background-position: -40% 0; } to { background-position: 140% 0; } }

#views { position: relative; flex: 1; margin: 0 var(--gap) var(--gap); border-radius: calc(var(--win-r) - var(--gap));
  -electron-corner-smoothing: 0%; background: transparent !important; overflow: hidden; background: var(--bg); }
webview { position: absolute; inset: 0; width: 100%; height: 100%; visibility: hidden; }
webview.active { visibility: visible; }
body.full header, body.full #tabbar, body.full #load { display: none; }
body.full #views { margin: 0; border-radius: 0; }

/* see-through (the player's Background below 100%): the window itself is transparent, and the
   browser draws its own rounded window shape. Maximized / full screen: square, edge to edge. */
html.see-through, html.see-through body { background: transparent; }
/* the same round corners as the player's windows (a plain circle, no squircle smoothing) */
html.see-through #root { background: var(--bg); border-radius: var(--win-r); overflow: hidden;
  -electron-corner-smoothing: 0%; }
html.see-through.maxed #root, html.see-through body.full #root { border-radius: 0; }
/* the thin frame around the window (Color and background in the player) */
/* The frame line twice on the same spot (--frame-dense, see setColors): the round corners get
   as dense as the straight edges, which stay exactly the frame's own color. */
html.framed:not(.maxed) #root { box-shadow: inset 0 0 0 1px var(--frame-dense), inset 0 0 0 1px var(--frame-dense); }
html.framed:not(.maxed) body.full #root { box-shadow: none; }

/* the start page (drawn here, see renderStart) */
#start { position: absolute; inset: 0; z-index: 2; overflow: auto; display: none; color: var(--text);
  user-select: none; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text) 35%, transparent) transparent; }
#start.on { display: block; animation: startIn 200ms var(--ease); }
@keyframes startIn { from { opacity: 0; } to { opacity: 1; } }
#start .wrap { padding: 28px 32px; }
#start h1 { color: var(--title); font-weight: 500; font-size: 22px; margin: 0 0 16px; }
#start h2 { display: flex; align-items: baseline; gap: 14px; color: var(--title); font-weight: 500; font-size: 15px;
  border-bottom: 2px solid var(--lines); padding-bottom: 4px; margin: 26px 0 12px; max-width: 900px; }
#start .restore { margin-left: auto; font-size: 12px; color: var(--text); opacity: .7; text-decoration: none; }
#start .restore:hover { opacity: 1; color: var(--lines); }
#start form.q { display: flex; max-width: 620px; }
#start input { flex: 1; min-width: 0; background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text);
  border: 1px solid var(--lines); border-bottom-width: 2px; padding: 9px 12px; font: inherit; font-size: 15px; outline: none;
  user-select: text; }
/* the search line reads well on any background (dark letters on a light one), like the note in
   Color and background */
#start form.q input { color: var(--readable); }
#start form.q input::placeholder { color: color-mix(in srgb, var(--readable) 55%, transparent); }
#start input::placeholder { color: color-mix(in srgb, var(--text) 55%, transparent); }
#start input::selection { background: var(--lines); color: #fff; }
#start .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; max-width: 900px; }
#start .tile { position: relative; }
#start .go { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: 12px;
  color: var(--text); text-decoration: none; border: 1px solid transparent; transition: border-color 180ms, background 180ms; }
#start .go:hover { border-color: var(--lines); background: color-mix(in srgb, var(--text) 6%, transparent); }
#start .ic { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--text);
  display: flex; align-items: center; justify-content: center; overflow: hidden; -electron-corner-smoothing: 0%; }
#start .ic img { position: absolute; width: 26px; height: 26px; background: var(--bg); }
#start .ic b { font-size: 19px; }
#start .ic svg { width: 20px; height: 20px; fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; }
#start .add .ic { border-style: dashed; opacity: .7; }
#start .add .nm { opacity: .7; }
#start .nm { font-size: 13px; text-align: center; overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
#start .tile > .x, #start .tile:not(.add) > .ed { position: absolute; top: 5px; width: 20px; height: 20px; display: grid;
  place-items: center; border-radius: 6px; opacity: 0; transition: opacity 160ms; }
#start .tile > .x { right: 6px; }
#start .tile:not(.add) > .ed { left: 6px; }
#start .tile > .x svg, #start .tile:not(.add) > .ed svg { width: 14px; height: 14px; fill: none; stroke: var(--lines); stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; }
#start .tile > .x:hover, #start .tile:not(.add) > .ed:hover { background: color-mix(in srgb, var(--text) 15%, transparent); }
#start .tile:hover > .x, #start .tile:not(.add):hover > .ed { opacity: 1; }
#start .hint { opacity: .6; font-size: 13px; }
#start .edit { grid-column: span 2; display: flex; flex-direction: column; gap: 7px; padding: 10px; border: 1px solid var(--lines);
  border-radius: 12px; animation: editIn 260ms var(--ease); }
@keyframes editIn { from { opacity: 0; transform: translateY(-6px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
#start .edit input { padding: 6px 9px; font-size: 13px; }
#start .edit .row { display: flex; gap: 7px; justify-content: flex-end; }
#start .edit button { background: transparent; color: var(--text); border: 1px solid color-mix(in srgb, var(--text) 40%, transparent);
  border-radius: 8px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
#start .edit button.ok { border-color: var(--lines); }
#start .edit button:hover { background: color-mix(in srgb, var(--text) 14%, transparent); }
#start .edit .err { font-size: 12px; color: var(--lines); }

/* glow, like Vital (Color and background in the player): only when switched on */
html.glow-text .btn svg, html.glow-text #start .ic svg { filter: drop-shadow(0 0 3px var(--glow-text)); }
html.glow-text .item, html.glow-text #start .nm, html.glow-text .tab .name { text-shadow: 0 0 7px var(--glow-text); }
html.glow-title #start h1, html.glow-title #start h2, html.glow-title .head { text-shadow: 0 0 9px var(--glow-title), 0 0 2px var(--glow-title); }
html.glow-lines #address, html.glow-lines .tab, html.glow-lines .island, html.glow-lines #toast,
html.glow-lines #start input, html.glow-lines #start .edit { box-shadow: 0 0 9px var(--glow-lines); }
html.glow-lines #start h2 { box-shadow: 0 7px 9px -7px var(--glow-lines); }
html.glow-lines #start .go:hover { box-shadow: 0 0 9px var(--glow-lines); }

/* islands: small menus inside the window; they slide down out of their button and back */
.island { position: absolute; z-index: 20; min-width: 200px; padding: 6px; background: var(--bg);
  border: 1px solid var(--lines); border-radius: 14px; opacity: 0; pointer-events: none;
  transform: translateY(-10px); clip-path: inset(0 0 100% 0 round 14px);
  transition: opacity var(--t) var(--ease), transform var(--t) var(--ease), clip-path var(--t) var(--ease); }
.island.open { opacity: 1; pointer-events: auto; transform: none; clip-path: inset(0 0 0 0 round 14px); }
.island { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--text) 35%, transparent) transparent; }
#sideIsland { z-index: 21; min-width: 170px; }
#tabCard { z-index: 23; min-width: 220px; max-width: 300px; padding: 10px 14px; pointer-events: none !important; }
#tabCard .t1 { color: var(--title); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tabCard .t1 .pin { font-weight: 400; opacity: .6; }
#tabCard .t2 { opacity: .7; font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tabCard .mem { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; font-size: 13px;
  border-top: 1px solid color-mix(in srgb, var(--text) 25%, transparent); }
#tabCard .mem { justify-content: flex-start; text-align: left; }
#tabCard .mem svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
#ctxIsland, #plIsland { z-index: 22; }   /* over a side panel */
#plIsland { min-width: 380px; }
#plIsland .lab { font-size: 12px; opacity: .7; margin: 8px 0 4px 2px; }
#plIsland .pair { display: flex; align-items: center; gap: 8px; }
#plIsland .pair select { flex: 1; min-width: 0; }
#plIsland .seg { display: flex; border: 1px solid color-mix(in srgb, var(--text) 25%, transparent); border-radius: 14px; padding: 2px; }
#plIsland .seg button { flex: 1; border: 2px solid transparent; border-radius: 12px; padding: 2px 8px; opacity: .6; white-space: nowrap; }
#plIsland .seg button.on { opacity: 1; border-color: var(--lines); }   /* over a side panel when opened from its field */
/* The header and the tab bar are "drag the window" areas. In Electron such an area takes the mouse
   even under anything drawn over it, so the Search engine row (right over the tab bar) never saw
   the mouse. The islands and the message are taken out of it. */
.island.open, #toast, #shield { -webkit-app-region: no-drag; }
/* (only an OPEN island: a closed one stays where it was, invisible, and its no-drag area kept a
   piece of the header from moving the window - after a right-click menu over the header) */
/* While a menu is open, an invisible sheet lies over everything else (pages included: a click
   into a page never reached this window before, so the menu stayed). Any click on it, left or
   right, only closes the menu. */
#shield { position: absolute; inset: 0; z-index: 19; display: none; }
#shield.on { display: block; }
.item.sub .val { margin-left: auto; padding-left: 18px; opacity: 0.6; }
.item.sub svg { width: 14px; height: 14px; margin-left: 6px; margin-right: -16px; }
.item.sub.active { background: color-mix(in srgb, var(--text) 15%, transparent); }
.item { display: flex; align-items: center; gap: 10px; padding: 7px 26px 7px 10px; border-radius: 8px;
  cursor: pointer; white-space: nowrap; }
.item:hover { background: color-mix(in srgb, var(--text) 15%, transparent); }
.item .mark { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.item.on .mark { background: var(--lines); }
.item svg { width: 16px; height: 16px; fill: none; stroke: var(--text); stroke-width: 1.9;
  stroke-linecap: round; stroke-linejoin: round; }
.item .key { margin-left: auto; padding-left: 24px; opacity: 0.6; }
.head { color: var(--title); padding: 6px 10px 3px; font-size: 12px; opacity: 0.85; }
.hr { height: 1px; margin: 5px 8px; background: color-mix(in srgb, var(--text) 18%, transparent); }

/* Notebook 17: notes and passwords, an island along the right side under the header */
.notes { display: flex; flex-direction: column; gap: 8px; padding: 10px; overflow: hidden; width: 380px; }
/* the window may be see-through: the notebook keeps its text readable (the same color, nearly solid, glass blur) */
.notes { background: rgb(from var(--bg) r g b / 0.96); backdrop-filter: blur(18px); }
.notes .top { display: flex; align-items: center; gap: 8px; }
.notes .top .title { color: var(--title); font-weight: 700; font-size: 15px; margin-right: auto; padding-left: 4px; }
.notes .seg { display: flex; border: 1px solid color-mix(in srgb, var(--text) 25%, transparent); border-radius: 14px; padding: 2px; }
.notes .seg button { background: transparent; color: var(--text); border: 2px solid transparent; border-radius: 12px;
  padding: 2px 10px; font: inherit; font-size: 13px; opacity: .6; cursor: pointer; }
.notes .seg button.on { opacity: 1; border-color: var(--lines); }
.notes input, .notes textarea { background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text);
  border: 1px solid var(--lines); border-bottom-width: 2px; border-radius: 0; padding: 7px 10px; font: inherit;
  font-size: 14px; outline: none; min-width: 0; box-sizing: border-box; width: 100%; }
.notes input::placeholder, .notes textarea::placeholder { color: color-mix(in srgb, var(--text) 50%, transparent); }
.notes input::selection, .notes textarea::selection { background: var(--lines); color: #fff; }
.notes textarea { flex: 1; resize: none; line-height: 1.45; min-height: 120px;
  scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text) 35%, transparent) transparent; }
.notes .list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--text) 35%, transparent) transparent; }
.notes .row { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 10px; border-radius: 8px; cursor: pointer; }
.notes .row:hover { background: color-mix(in srgb, var(--text) 12%, transparent); }
.notes .row .txt { flex: 1; min-width: 0; }
.notes .row .t1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notes .row .t2 { font-size: 12px; opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notes .row .btn { padding: 4px; }
.notes .row .btn svg { width: 16px; height: 16px; }
.notes .add { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.notes .add:hover { background: color-mix(in srgb, var(--text) 12%, transparent); }
.notes .add svg { width: 16px; height: 16px; fill: none; stroke: var(--text); stroke-width: 1.9; stroke-linecap: round; }
.notes .empty, .notes .msg { opacity: .6; font-size: 13px; padding: 6px 10px; }
.notes .msg.err { opacity: 1; color: var(--lines); }
.notes .bar { display: flex; align-items: center; gap: 6px; }
.notes .bar .grow { flex: 1; }
.notes .lab { font-size: 12px; opacity: .7; margin: 2px 0 -4px 2px; }
.notes .pw { display: flex; gap: 4px; align-items: center; }
.notes .pw input { flex: 1; }
.notes .act { background: transparent; color: var(--text); border: 1px solid color-mix(in srgb, var(--text) 40%, transparent);
  border-radius: 8px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.notes .act:hover { background: color-mix(in srgb, var(--text) 14%, transparent); border-color: var(--lines); }
.notes .act.warn { border-color: var(--lines); color: var(--lines); }
.notes .prog { height: 2px; margin-top: 5px; background: color-mix(in srgb, var(--text) 18%, transparent); }
.notes .prog i { display: block; height: 100%; background: var(--lines); }
.notes .row.done { cursor: pointer; }
.notes .row.off .t1 { opacity: .55; }
.notes .row .ico { width: 22px; height: 22px; flex: none; border-radius: 5px; object-fit: contain; }
.notes .row .ico.none { border: 1px solid color-mix(in srgb, var(--text) 35%, transparent); }
.notes .act.on { border-color: var(--lines); }
.notes .row span.ico svg { width: 20px; height: 20px; fill: none; stroke: var(--text); stroke-width: 1.9;
  stroke-linecap: round; stroke-linejoin: round; }
#translate.on svg { stroke: var(--lines); }
.notes .hint { font-size: 12px; opacity: .55; padding: 0 2px; }
.notes webview { flex: 1; min-height: 0; border: 1px solid color-mix(in srgb, var(--text) 18%, transparent); border-radius: 8px;
  background: #fff; position: static; visibility: visible; width: auto; height: auto; }
.notes select, .tr select { background: var(--bg); color: var(--text); border: 1px solid var(--lines); border-radius: 8px;
  padding: 4px 8px; font: inherit; font-size: 13px; outline: none; }
.notes .seg.wide { align-self: stretch; }
.notes .seg.wide button { flex: 1; }
.notes .langs { display: flex; align-items: center; gap: 8px; padding: 2px 6px 10px 42px; }
.notes .langs select { flex: 1; min-width: 0; }
.notes .langs .arrow { opacity: .6; }
.notes .set { display: flex; flex-direction: column; gap: 6px; padding: 4px 2px; }
/* Translator 17: the island with a translation */
.island.tr { max-width: 460px; min-width: 260px; padding: 10px 12px; background: rgb(from var(--bg) r g b / 0.96); backdrop-filter: blur(18px); }
.tr .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.tr .bar .name { color: var(--title); font-weight: 700; font-size: 13px; margin-right: auto; }
.tr .out { user-select: text; white-space: pre-wrap; line-height: 1.45; max-height: 50vh; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text) 35%, transparent) transparent; }
.tr .out::selection { background: var(--lines); color: #fff; }
.tr .foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; }
.tr .foot .from { opacity: .6; margin-right: auto; }
.tr button { background: transparent; color: var(--text); border: 1px solid color-mix(in srgb, var(--text) 40%, transparent);
  border-radius: 8px; padding: 3px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.tr button:hover { background: color-mix(in srgb, var(--text) 14%, transparent); border-color: var(--lines); }
.notes .form { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow-y: auto; }

#toast { position: absolute; left: 50%; bottom: 28px; z-index: 30; padding: 7px 16px; max-width: 70%;

  transition: opacity var(--t) var(--ease), transform var(--t) var(--ease); }

#toast.link { pointer-events: auto; cursor: pointer; }
</style>

<script>
"use strict";
const P = window.p17;
const INIT = P.init() || {};
const C = Object.assign({ bg: "#000000", text: "#0a84ff", title: "#ffffff", lines: "#ff0080" }, INIT.colors || {});
// The player's colors, opacity included (#rrggbbaa): the Background's opacity makes the browser
// see-through too (when the window was made see-through, see main.js).
// white or near-black letters, whichever reads better on the background (as in the player)
function readableOn(hex) {
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(hex || "");
  if (!m) return "#ffffff";
  const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const light = 0.2126 * lin(parseInt(m[1], 16)) + 0.7152 * lin(parseInt(m[2], 16)) + 0.0722 * lin(parseInt(m[3], 16));
  return 1.05 / (light + 0.05) >= (light + 0.05) / 0.05 ? "#ffffff" : "#111111";
}
const glowOn = (v) => /^#[0-9a-f]{6}$/i.test(v) || (/^#[0-9a-f]{8}$/i.test(v) && v.slice(7).toLowerCase() !== "00");
function setColors(colors) {
  const root = document.documentElement;
  for (const key of ["bg", "text", "title", "lines", "glow_text", "glow_title", "glow_lines", "frame"]) {
    const value = String((colors || {})[key] || C[key] || "");
    if (/^#[0-9a-f]{6}([0-9a-f]{2})?$/i.test(value)) C[key] = value;
    if (!C[key]) continue;
    root.style.setProperty("--" + key.replace("_", "-"), C[key]);
    if (key.startsWith("glow_")) root.classList.toggle(key.replace("_", "-"), glowOn(C[key]));
  }
  root.style.setProperty("--readable", readableOn(C.bg));
  root.style.setProperty("--frame-dense", denseFrame(C.frame, C.bg));
  root.classList.toggle("see-through", !!INIT.transparent);
}
// The frame is drawn twice (denser round corners); each pass must keep the straight edges as they
// were: over a solid background the frame already mixed over it (solid), otherwise an opacity
// that gives the frame's own one when doubled. (The same as dense_frame_color in the player.)
function denseFrame(frame, bg) {
  const rgba = (hex) => {
    const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})?$/i.exec(hex || "");
    if (!m) return [255, 0, 128, 1];
    return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16), m[4] ? parseInt(m[4], 16) / 255 : 1];
  };
  const [r, g, b, a] = rgba(frame);
  const [br, bgr, bb, ba] = rgba(bg);
  if (ba >= 0.999 && !INIT.transparent) {
    const mix = (c, under) => Math.round(c * a + under * (1 - a));
    return `rgb(${mix(r, br)}, ${mix(g, bgr)}, ${mix(b, bb)})`;
  }
  return `rgba(${r}, ${g}, ${b}, ${(1 - Math.sqrt(Math.max(0, 1 - a))).toFixed(4)})`;
}
document.documentElement.classList.toggle("framed", INIT.frame !== false);
setColors(C);
const $ = (id) => document.getElementById(id);

const ENGINES = {
  google: ["Google", "https://www.google.com/search?q={q}"],
  duckduckgo: ["DuckDuckGo", "https://duckduckgo.com/?q={q}"],
  bing: ["Bing", "https://www.bing.com/search?q={q}"],
  brave: ["Brave Search", "https://search.brave.com/search?q={q}"],
  yandex: ["Yandex", "https://yandex.com/search/?text={q}"],
  startpage: ["Startpage", "https://www.startpage.com/do/search?q={q}"],
  ecosia: ["Ecosia", "https://www.ecosia.org/search?q={q}"],
};
const SITES = [
  ["YouTube Music", "https://music.youtube.com"], ["YouTube", "https://www.youtube.com"],
  ["SoundCloud", "https://soundcloud.com"], ["Bandcamp", "https://bandcamp.com"],
  ["Mixcloud", "https://www.mixcloud.com"], ["Audiomack", "https://audiomack.com"],
  ["Jamendo", "https://www.jamendo.com"], ["Internet Archive", "https://archive.org/details/audio"],
];
const state = {
  pinned: Array.isArray(INIT.pinned) ? INIT.pinned : [],
  engine: ENGINES[INIT.engine] ? INIT.engine : "google",
  tabsShown: INIT.tabs_shown !== false,
  onePlayer: INIT.one_player !== false,
  linksNewTab: !!INIT.links_new_tab,
  theme: INIT.site_theme || "auto",
  rate: INIT.sample_rate || "auto",   // Browser-17 on its own: the sound chain's sample rate
  // the music sites row: the user's own edited list, or the original one (null = original)
  sites: null,
  sitesChanged: false,
};
const normUrl = (u) => String(u || "").replace(/[/]+$/, "");
const DEFAULT_SITES = SITES.map(([title, url]) => ({ title, url }));
const cleanList = (list) => (Array.isArray(list) ? list : [])
  .filter((p) => p && typeof p.url === "string" && p.url)
  .map((p) => ({ title: typeof p.title === "string" ? p.title : "", url: p.url }));
state.pinned = cleanList(state.pinned);
state.sitesChanged = Array.isArray(INIT.sites);
state.sites = state.sitesChanged ? cleanList(INIT.sites) : DEFAULT_SITES.map((p) => ({ ...p }));

// line icons (24x24), drawn with the text color, pink under the mouse
const ICONS = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  forward: '<path d="M9 6l6 6-6 6"/>',
  reload: '<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4.5H15"/>',
  home: '<path d="M4 11.5L12 5l8 6.5"/><path d="M6.5 10v9h4v-5h3v5h4v-9"/>',
  star: '<path d="M12 3.8l2.5 5.1 5.6.8-4 4 1 5.5-5.1-2.7-5.1 2.7 1-5.5-4-4 5.6-.8z"/>',
  volume: '<path d="M4.5 9.5h3L12 6v12l-4.5-3.5h-3z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18 6.8a7.5 7.5 0 0 1 0 10.4"/>',
  muted: '<path d="M4.5 9.5h3L12 6v12l-4.5-3.5h-3z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',

  up: '<path d="M7 14l5-5 5 5"/>',
  menu: '<path d="M5 7h14M5 12h14M5 17h14"/>',
  plus: '<path d="M12 6v12M6 12h12"/>',

  video: '<rect x="3.5" y="6.5" width="12" height="11" rx="1.5"/><path d="M15.5 10.5l5-3v9l-5-3"/>',

  paste: '<rect x="5.5" y="5" width="13" height="15" rx="2"/><path d="M9.5 5V3.5h5V5"/><path d="M9 11h6M9 15h4"/>',
  undo: '<path d="M9 7.5L5 11.5l4 4"/><path d="M5 11.5h9a5 5 0 0 1 0 10h-2"/>',
  redo: '<path d="M15 7.5l4 4-4 4"/><path d="M19 11.5h-9a5 5 0 0 0 0 10h2"/>',
  select: '<rect x="4.5" y="4.5" width="15" height="15" rx="2" stroke-dasharray="3 2.5"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  image: '<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.7"/><path d="M20.5 16l-5-5-8.5 8"/>',
  search: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/>',

  user: '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5a7 7 0 0 1 14 0"/>',
  eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  dice: '<rect x="4.5" y="4.5" width="15" height="15" rx="3"/><circle cx="9" cy="9" r=".9"/><circle cx="15" cy="15" r=".9"/><circle cx="15" cy="9" r=".9"/><circle cx="9" cy="15" r=".9"/>',
  translate: '<path d="M3.5 5.5h9M8 3.5v2M5.5 5.5c.9 3 3 5.4 6 6.8M10.5 5.5c-.9 3.2-3.2 5.6-6.5 7"/><path d="M12.5 20.5l4-9 4 9M14 17.3h5"/>',

  gauge: '<path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 13.5l3.5-4"/><circle cx="12" cy="14" r="1.2"/>',
  puzzle: '<path d="M10 4.5h4v2.5a1.5 1.5 0 0 0 3 0V4.5h2.5V10H17a1.5 1.5 0 0 0 0 3h2.5v6.5H14V17a1.5 1.5 0 0 0-3 0v2.5H4.5V14H7a1.5 1.5 0 0 0 0-3H4.5V4.5z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.5M12 18v2.5M3.5 12H6M18 12h2.5M6 6l1.8 1.8M16.2 16.2L18 18M6 18l1.8-1.8M16.2 7.8L18 6"/>',
  folder: '<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
  pause: '<path d="M9 6v12M15 6v12"/>',
  play: '<path d="M8 5.5v13l10-6.5z"/>',

const svg = (name) => `<svg viewBox="0 0 24 24">${ICONS[name] || ""}</svg>`;
const esc = (text) => String(text == null ? "" : text).replace(/[&<>"']/g,
  (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

document.querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = svg(el.dataset.icon); });
const DOT_SYMBOLS = { close: '<path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/>', min: '<path d="M7.5 12h9"/>',
  max: '<path d="M8.5 8.5h7v7h-7z"/>' };
document.querySelectorAll(".dot").forEach((dot) => {
  dot.innerHTML = `<svg viewBox="0 0 24 24">${DOT_SYMBOLS[dot.dataset.act]}</svg>`;
  dot.onclick = () => P.win({ action: dot.dataset.act });
});
$("plugins").innerHTML = svg("plugins") + "<span>Plugins</span>";
$("header").addEventListener("dblclick", (e) => { if (e.target === $("header") || e.target.classList.contains("space")) P.win({ action: "max" }); });

// ---------------- the start page ----------------
// Drawn by the browser window itself, over the tab's (empty) page: so it is see-through with the
// window, follows the colors at once, and its tiles are edited right here. The tab underneath
// holds an empty "Start" page only for the history (Back returns to it).
// Every tile can be edited: the pencil opens its address and name, the cross removes it, the "+"
// tile adds a site; both rows (your sites, music sites).
const startUrl = () => "data:text/html;charset=utf-8," +
  encodeURIComponent('<!doctype html><title>Start</title><meta name="color-scheme" content="only light"><body style="background:transparent"></body>');
const isStartUrl = (u) => !u || u.startsWith("data:");

function tileHtml(list, i, title, url) {
  let host = "";
  try { host = new URL(url).host; } catch (e) {}
  const letter = esc((title || host || "?").slice(0, 1).toUpperCase());
  return `<div class="tile" data-l="${list}" data-i="${i}" data-t="${esc(title || "")}" data-u="${esc(url)}">` +
    `<a class="go" href="${esc(url)}" draggable="false"><span class="ic">` +
    `<img src="https://icons.duckduckgo.com/ip3/${esc(host)}.ico" onerror="this.remove()"><b>${letter}</b></span>` +
    `<span class="nm">${esc(title || host)}</span></a>` +
    `<a class="ed" href="#" title="Edit">${svg("edit")}</a>` +
    `<a class="x" href="#" title="Remove">${svg("close")}</a></div>`;
}
const addTileHtml = (list) => `<div class="tile add" data-l="${list}" data-i="-1" data-t="" data-u="">` +
  `<a class="go ed" href="#" title="Add a site"><span class="ic">${svg("plus")}</span><span class="nm">Add site</span></a></div>`;

function renderStart() {
  const box = $("start");
  const keep = box.querySelector("form.q input");
  const typed = keep ? keep.value : "";
  const hadFocus = keep && document.activeElement === keep;
  const [name] = ENGINES[state.engine];
  const own = state.pinned.map((p, i) => tileHtml("own", i, p.title, p.url)).join("");
  const ready = state.sites.map((p, i) => tileHtml("music", i, p.title, p.url)).join("");
  const hint = own ? "" : '<p class="hint">Press "+" and type a site, or open any site and press the star at the top.</p>';
  const restore = state.sitesChanged ? '<a class="restore" href="#">Restore the original list</a>' : "";
  box.innerHTML = `<div class="wrap"><h1>${INIT.standalone ? "Browser-17" : "Player-17 browser"}</h1>` +
    `<form class="q"><input name="q" placeholder="Search with ${esc(name)}" spellcheck="false"></form>` +
    `<h2>Your sites</h2>${hint}<div class="grid">${own}${addTileHtml("own")}</div>` +
    `<h2>Music sites ${restore}</h2><div class="grid">${ready}${addTileHtml("music")}</div></div>`;
  const input = box.querySelector("form.q input");
  input.value = typed;
  if (hadFocus) input.focus();
}

function updateStart() {
  const on = !!current && current.view === "start";
  $("start").classList.toggle("on", on);
  for (const tab of tabs) tab.wv.style.visibility = tab === current && on ? "hidden" : "";
}

let startEdit = null;
function closeStartEdit() {
  if (startEdit) { startEdit.form.remove(); startEdit.tile.style.display = ""; startEdit = null; }
}
function editTile(tile) {
  closeStartEdit();
  const form = document.createElement("form");
  form.className = "edit";
  form.innerHTML = '<input class="site" placeholder="Site, e.g. soundcloud.com" spellcheck="false">' +
    '<input class="name" placeholder="Name (optional)" spellcheck="false"><div class="err"></div>' +
    `<div class="row"><button type="button" class="cancel">Cancel</button>` +
    `<button type="submit" class="ok">${tile.dataset.i === "-1" ? "Add" : "Save"}</button></div>`;
  const site = form.querySelector(".site"), title = form.querySelector(".name"), err = form.querySelector(".err");
  site.value = tile.dataset.u;
  title.value = tile.dataset.t;
  form.querySelector(".cancel").onclick = closeStartEdit;
  form.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeStartEdit(); } });
  form.onsubmit = (e) => {
    e.preventDefault();
    let u = site.value.trim();
    if (!u) { err.textContent = "Type the site's address"; site.focus(); return; }
    if (!u.includes("://")) u = "https://" + u;
    let parsed;
    try { parsed = new URL(u); } catch (x) { parsed = null; }
    if (!parsed || !/^https?:$/.test(parsed.protocol) || !parsed.hostname.includes(".")) {
      err.textContent = "This does not look like a site address"; site.focus(); return;
    }
    saveTile(tile.dataset.l, parseInt(tile.dataset.i, 10), parsed, title.value.trim());
  };
  tile.parentNode.insertBefore(form, tile);
  tile.style.display = "none";
  startEdit = { form, tile };
  site.focus();
  site.select();
}
function saveTile(listName, i, url, title) {
  const own = listName !== "music";
  const list = own ? state.pinned : state.sites;
  const entry = { title: title || url.hostname.replace(/^www[.]/, ""), url: url.href };
  if (i >= 0 && i < list.length) list[i] = entry;
  else list.push(entry);
  startEdit = null;
  saveStartLists(own ? "own" : "music");
}
function removeTile(listName, i) {
  const own = listName !== "music";
  const list = own ? state.pinned : state.sites;
  if (i >= 0 && i < list.length) list.splice(i, 1);
  saveStartLists(own ? "own" : "music");
}

$("start").addEventListener("click", (e) => {
  const tile = e.target.closest(".tile");
  if (e.target.closest(".restore")) {
    e.preventDefault();
    state.sites = DEFAULT_SITES.map((p) => ({ ...p }));
    state.sitesChanged = false;
    P.send({ ev: "set", key: "web_sites", value: null });
    refreshStartPages();
  } else if (tile && e.target.closest(".x")) {
    e.preventDefault();
    removeTile(tile.dataset.l, parseInt(tile.dataset.i, 10));
  } else if (tile && e.target.closest(".ed")) {
    e.preventDefault();
    editTile(tile);
  } else if (tile && e.target.closest(".go")) {
    e.preventDefault();
    const url = tile.dataset.u;
    if (e.ctrlKey || e.metaKey) newTab(url, false);
    else { navigate(current, url); current.wv.focus(); }
  }
});
$("start").addEventListener("auxclick", (e) => {  // middle click on a tile: a new tab
  const tile = e.target.closest(".tile:not(.add)");
  if (tile && e.button === 1) { e.preventDefault(); newTab(tile.dataset.u, false); }
});
$("start").addEventListener("submit", (e) => {
  if (!e.target.classList.contains("q")) return;
  e.preventDefault();
  const v = e.target.q.value.trim();
  if (v) { e.target.q.value = ""; go(v); }
});

// ---------------- tabs ----------------
const tabs = [];
let current = null;
let lastPlaying = false;
const PAUSE_JS = "document.querySelectorAll('video, audio').forEach(function (m) { m.pause(); });";

function urlOf(tab) {
  if (tab.lazy) return tab.lazy;   // not loaded yet: its address
  try { return tab.wv.getURL() || ""; } catch (e) { return tab.pending || ""; }
}
const onStart = (tab) => !!tab && tab.view === "start";

// lazy: a tab brought back at start that isn't shown yet. It keeps only its address and loads the
// page when it is first opened, so a pinned YouTube Music doesn't start playing by itself.
function newTab(url, switchTo = true, pinned = false, lazy = false) {
  const tab = { title: "", audible: false, loading: false, pending: url || "", pinned: false,
    view: url ? "page" : "start", lazy: lazy && url ? url : "" };
  const wv = document.createElement("webview");
  wv.setAttribute("allowpopups", "");
  // a tab brought back opens paused (like Brave): its music waits for a click on Play. Starting
  // by itself while the heavy page was still loading, YouTube Music stuttered at first.
  if (tab.lazy) wv.setAttribute("webpreferences", "autoplayPolicy=document-user-activation-required");
  wv.setAttribute("src", tab.lazy ? startUrl() : (url || startUrl()));
  tab.wv = wv;
  const chip = document.createElement("div");
  chip.className = "tab noicon";
  chip.innerHTML = `<img hidden><b class="letter"></b><span class="name">New tab</span>` +
    `<button class="btn" title="Close tab (Ctrl+W, or middle click on the tab)">${svg("close")}</button>`;
  chip.addEventListener("mousedown", (e) => { if (e.button === 1) { e.preventDefault(); closeTab(tab); } });
  chip.addEventListener("click", (e) => { if (e.target.closest("button")) closeTab(tab); else selectTab(tab); });
  chip.addEventListener("contextmenu", (e) => { e.preventDefault(); hideTabCard(); openTabMenu(tab); });
  chip.addEventListener("mouseenter", () => tabCardSoon(tab));
  chip.addEventListener("mouseleave", hideTabCard);
  chip.addEventListener("mousedown", hideTabCard);
  tab.chip = chip;
  $("tabs").appendChild(chip);
  $("views").appendChild(wv);
  tabs.push(tab);
  if (pinned) setPinned(tab, true, false);

  wv.addEventListener("page-title-updated", (e) => { tab.title = e.title; updateChip(tab); if (tab === current) sendTitle(); });
  wv.addEventListener("did-navigate", (e) => {
    if (tab.lazy) { tab.view = "page"; updateChip(tab); return; }   // (its blank placeholder, not its page)
    tab.pending = "";
    tab.view = isStartUrl(e.url) ? "start" : "page";
    if (tab === current) updateStart();
    updateChip(tab);
    if (tab === current) showAddress();
    if (tab.pinned) savePinnedTabs(); // a pinned tab opens again where it was left
  });
  wv.addEventListener("did-navigate-in-page", (e) => {
    if (e.isMainFrame !== false && tab === current) showAddress();
    if (e.isMainFrame !== false) pageExtras(tab);
  });
  wv.addEventListener("did-start-loading", () => { tab.loading = true; if (tab === current) $("load").classList.add("on"); });
  wv.addEventListener("did-stop-loading", () => {
    tab.loading = false;
    if (tab === current) { $("load").classList.remove("on"); showAddress(); }
    pageExtras(tab);
  });
  wv.addEventListener("page-favicon-updated", (e) => {
    const img = chip.querySelector("img");
    if (e.favicons && e.favicons[0] && !onStart(tab)) {
      img.onerror = () => { img.hidden = true; chip.classList.add("noicon"); };
      img.src = e.favicons[0];
      img.hidden = false;
      chip.classList.remove("noicon");
    }
  });
  wv.addEventListener("media-started-playing", () => {
    tab.audible = true;
    if (state.onePlayer) pauseOthers(tab);
    updateChip(tab);
    reportPlaying(true);
  });
  wv.addEventListener("media-paused", () => { tab.audible = false; updateChip(tab); reportPlaying(false); });
  wv.addEventListener("enter-html-full-screen", () => document.body.classList.add("full"));
  wv.addEventListener("leave-html-full-screen", () => document.body.classList.remove("full"));
  wv.addEventListener("render-process-gone", () => setTimeout(() => { try { wv.reload(); } catch (e) {} }, 600));

  if (tab.lazy) updateChip(tab);
  if (switchTo || (!current && !tab.lazy)) selectTab(tab);
  else notice(state.tabsShown ? "" : `Opened in a new tab (${tabs.length} tabs)`);
  return tab;
}

function selectTab(tab) {
  if (!tabs.includes(tab)) return;
  if (tab.lazy) {   // first opened: now the page loads
    const u = tab.lazy;
    tab.lazy = "";
    tab.pending = u;
    try { tab.wv.loadURL(u).catch(() => {}); } catch (e) { tab.wv.setAttribute("src", u); }
  }
  current = tab;
  for (const other of tabs) {
    other.wv.classList.toggle("active", other === tab);
    other.chip.classList.toggle("active", other === tab);
  }
  $("load").classList.toggle("on", tab.loading);
  updateStart();
  showAddress(true);
  sendTitle();
}

function closeTab(tab, force = false) {
  if (!tabs.includes(tab)) return;
  if (tab.pinned && !force) {
    notice("The tab is pinned: right click on it → Unpin tab, then it can be closed");
    return;
  }
  if (tab.pinned) setPinned(tab, false, false);
  if (tabs.length === 1) { showStart(tab); savePinnedTabs(); return; } // the last tab goes back to the start page
  const i = tabs.indexOf(tab);
  tabs.splice(i, 1);
  tab.chip.remove();
  tab.wv.remove();
  if (tab === current) selectTab(tabs[Math.min(i, tabs.length - 1)]);
  if (tab.audible) reportPlaying(false);
  savePinnedTabs();
}

// ---------------- pinned tabs ----------------
// Pin / unpin from the tab's own menu (right click). Pinned tabs stand first, show only the
// site's icon, are not closed by accident and open again with the browser.
function setPinned(tab, on, save = true) {
  on = !!on;
  tab.pinned = on;
  tab.chip.classList.toggle("pinned", on);
  // the order: every pinned tab first (in the list and on screen)
  tabs.splice(tabs.indexOf(tab), 1);
  const pinnedCount = tabs.filter((t) => t.pinned).length;
  tabs.splice(pinnedCount, 0, tab); // right after the pinned ones
  const after = tabs[tabs.indexOf(tab) + 1];
  $("tabs").insertBefore(tab.chip, after ? after.chip : null);
  updateChip(tab);
  if (save) {
    savePinnedTabs();
    notice(on ? "Tab pinned: it opens again with the browser" : "Tab unpinned");
  }
}
let pinSave = 0;
function savePinnedTabs() {
  clearTimeout(pinSave);
  pinSave = setTimeout(() => {
    const urls = tabs.filter((t) => t.pinned && !onStart(t)).map(urlOf).filter(Boolean);
    P.send({ ev: "set", key: "web_pinned_tabs", value: urls });
  }, 300);
}
function openTabMenu(tab) {
  const build = (island) => {
    const others = tabs.filter((t) => t !== tab && !t.pinned);
    const rows = [
      tab.pinned
        ? item("Unpin tab", { icon: "unpin", act: () => setPinned(tab, false) })
        : item("Pin tab", { icon: "pin", act: () => setPinned(tab, true) }),
      item("Reload", { icon: "reload", act: () => { try { tab.wv.reload(); } catch (e) {} } }),
      item("Duplicate tab", { icon: "copy", act: () => newTab(onStart(tab) ? "" : urlOf(tab), true) }),
      hr(),
      item(tab.pinned ? "Unpin and close" : "Close tab", { icon: "close", key: tab.pinned ? "" : "Ctrl+W",
        act: () => closeTab(tab, true) }),
    ];
    if (others.length) {
      rows.push(item("Close other tabs", { icon: "close", act: () => others.forEach((t) => closeTab(t)) }));
    }
    island.replaceChildren(...rows);
  };
  openIslandAt($("tabIsland"), tab.chip, "left", build);
}

function stepTab(delta) {
  if (tabs.length > 1) selectTab(tabs[(tabs.indexOf(current) + delta + tabs.length) % tabs.length]);
}

function navigate(tab, url) {
  tab.pending = url;
  tab.view = isStartUrl(url) ? "start" : "page";
  if (tab === current) updateStart();
  try { tab.wv.loadURL(url).catch(() => {}); } catch (e) { tab.wv.setAttribute("src", url); }
}

function showStart(tab) {
  tab = tab || current;
  const img = tab.chip.querySelector("img");
  img.hidden = true;
  tab.chip.classList.add("noicon");
  navigate(tab, startUrl());
}

function go(text) {
  text = text.trim();
  if (!text) return;
  let url;
  const first = text.split(" ")[0];
  if (first.includes("://")) url = text;
  else if (!text.includes(" ") && text.includes(".")) url = "https://" + text;
  else if (urlOf(current).includes("music.youtube.com")) url = "https://music.youtube.com/search?q=" + encodeURIComponent(text);
  else url = ENGINES[state.engine][1].replace("{q}", encodeURIComponent(text));
  navigate(current, url);
  current.wv.focus();
}

function pauseOthers(playing) {
  for (const tab of tabs) {
    if (tab !== playing && tab.audible) tab.wv.executeJavaScript(PAUSE_JS).catch(() => {});
  }
}

function reportPlaying(started) {
  const on = tabs.some((t) => t.audible);
  if (on !== lastPlaying || started) {
    lastPlaying = on;
    P.send({ ev: "playing", on });
  }
}

function updateChip(tab) {
  let host = "";
  try { host = new URL(urlOf(tab)).host; } catch (e) {}
  const text = onStart(tab) ? "Start page" : (tab.title || host || "New tab");
  tab.chip.querySelector(".name").textContent = (tab.audible ? "♪  " : "") + text;
  tab.chip.querySelector(".letter").textContent = (host.replace(/^www\./, "") || text || "?").slice(0, 1).toUpperCase();
  tab.chip.classList.toggle("playing", !!tab.audible);
  tab.chip.removeAttribute("title");   // (the tab's card says it: tabCard)
}

// the tab's card, under the tab while the pointer rests on it (like Brave): its name, its

let tabCardTimer = 0;
function tabCardSoon(tab) {

  tabCardTimer = setTimeout(() => showTabCard(tab), $("tabCard").classList.contains("open") ? 0 : 450);
}
function hideTabCard() {
  clearTimeout(tabCardTimer);
  $("tabCard").classList.remove("open");
}
async function showTabCard(tab) {
  if (!tabs.includes(tab) || openIsland) return;
  const card = $("tabCard");
  let host = "";
  try { host = new URL(urlOf(tab)).host; } catch (e) {}
  const name = onStart(tab) ? "Start page" : (tab.title || host || "New tab");
  const line = (text) => `<div class="mem">${svg("gauge")}<span>${esc(text)}</span></div>`;
  const fill = (memText) => {
    card.innerHTML = `<div class="t1">${esc(name)}${tab.pinned ? ' <span class="pin">· pinned</span>' : ""}</div>` +
      (host && !onStart(tab) ? `<div class="t2">${esc(host)}</div>` : "") + line(memText);
  };
  fill(tab.lazy ? "Asleep: loads when opened" : "Memory usage: …");
  const r = tab.chip.getBoundingClientRect();
  card.style.left = Math.max(8, Math.min(r.left, innerWidth - 300)) + "px";
  card.style.top = (r.bottom + 6) + "px";
  card.classList.add("open");
  if (tab.lazy) return;
  let mb = 0;
  try { mb = await P.mem(tab.wv.getWebContentsId()); } catch (e) {}
  if (card.classList.contains("open")) fill(mb ? `Memory usage: ${mb} MB` : "Memory usage: —");

function cleanTitle(tab) {
  let title = onStart(tab) ? "" : (tab.title || "").trim();
  for (const tail of [" - YouTube Music", " | YouTube Music"]) {
    if (title.endsWith(tail)) title = title.slice(0, -tail.length);
  }
  return title;
}

function sendTitle() {
  if (!current) return;
  const title = cleanTitle(current);
  const appName = INIT.standalone ? "Browser-17" : "Player-17 Browser";
  document.title = title ? `${title}  ·  ${appName}` : appName;
  P.send({ ev: "title", text: title });
}

function showAddress(force) {
  if (!current) return;
  if (typeof updateTranslateButton === "function") updateTranslateButton();
  const url = onStart(current) ? "" : urlOf(current);
  let back = false, forward = false;
  try { back = current.wv.canGoBack(); forward = current.wv.canGoForward(); } catch (e) {}
  $("back").disabled = !back;
  $("forward").disabled = !forward;
  const pinned = !!url && state.pinned.some((p) => normUrl(p.url) === normUrl(url));
  $("pin").querySelector("svg").style.fill = pinned ? "var(--text)" : "none";
  $("pin").disabled = !url;
  if (force || document.activeElement !== $("address")) $("address").value = url;
}

function togglePin() {
  if (onStart(current)) return;
  const url = urlOf(current);
  if (state.pinned.some((p) => normUrl(p.url) === normUrl(url))) {
    state.pinned = state.pinned.filter((p) => normUrl(p.url) !== normUrl(url));
    notice("Removed from the start page");
  } else {
    state.pinned.push({ title: current.title || url, url });
    notice("Added to the start page");
  }
  P.send({ ev: "set", key: "web_pinned", value: state.pinned });
  showAddress();
  refreshStartPages();
}

function refreshStartPages() {
  renderStart();  // one start page for every tab: drawn again, no page loads
}

// ---------------- the header ----------------
$("back").onclick = () => { try { current.wv.goBack(); } catch (e) {} };
$("forward").onclick = () => { try { current.wv.goForward(); } catch (e) {} };
$("reload").onclick = () => { try { current.wv.reload(); } catch (e) {} };
$("home").onclick = () => {
  if (onStart(current)) { const q = $("start").querySelector("form.q input"); if (q) q.focus(); }
  else showStart();
};
$("pin").onclick = togglePin;
$("newtab").onclick = () => { newTab(); $("address").focus(); };
$("address").addEventListener("keydown", (e) => {
  if (e.key === "Enter") go($("address").value);
  else if (e.key === "Escape") { showAddress(true); current.wv.focus(); }

$("address").addEventListener("focus", () => setTimeout(() => $("address").select(), 0));

// sound: the browser's own volume and Plugins (the player plays the sound through its chain)
let beforeMute = 100;
const volume = $("volume");
volume.value = Math.round((Number(INIT.volume == null ? 1 : INIT.volume)) * 100);
function showVolume() {
  volume.style.setProperty("--fill", volume.value + "%");
  $("mute").innerHTML = svg(Number(volume.value) === 0 ? "muted" : "volume");
}

$("mute").onclick = () => {
  if (Number(volume.value) > 0) { beforeMute = Number(volume.value); volume.value = 0; }
  else volume.value = beforeMute || 100;
  volume.dispatchEvent(new Event("input"));
};
showVolume();
$("plugins").onclick = () => P.send({ ev: "plugins" });   // the Plugins window (the player's own)
if (INIT.route === false) {
  for (const id of ["mute", "volume", "plugins"]) {
    $(id).disabled = true;
    $(id).title = "Needs pactl:  sudo apt install pulseaudio-utils  (then restart the player)";
  }
  setTimeout(() => notice("Volume and Plugins need pactl:  sudo apt install pulseaudio-utils"), 800);

// tabs shown / hidden
function showTabs(on, save = true) {
  if (save && state.tabsShown !== !!on) motionBlur($("tabbar"), !!on);
  state.tabsShown = !!on;
  $("tabbar").classList.toggle("hidden", !on);
  $("tabsArrow").innerHTML = svg(on ? "up" : "down");
  $("tabsArrow").title = on ? "Hide the tabs" : `Show the tabs (${tabs.length} open)`;
  if (save) P.send({ ev: "set", key: "web_tabs_shown", value: state.tabsShown });
}
$("tabsArrow").onclick = () => showTabs(!state.tabsShown);

// ---------------- motion blur ----------------
// Menus, the tab bar and messages slide in with a light vertical blur that clears as they come
// to rest (and blur again on the way out): the same calm "motion blur" in all the apps.
// Turned off when the system asks for less motion.
const MOTION_BLUR = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let blurCount = 0;
function motionBlur(el, opening, ms = 210, amount = 4) {
  if (!MOTION_BLUR || !el) return;
  if (!el._mb) {
    const NS = "http://www.w3.org/2000/svg";
    const holder = document.createElementNS(NS, "svg");
    holder.setAttribute("width", "0");
    holder.setAttribute("height", "0");
    holder.style.position = "absolute";
    const filter = document.createElementNS(NS, "filter");
    filter.id = "p17mb" + (++blurCount);
    for (const [k, v] of [["x", "-4%"], ["y", "-25%"], ["width", "108%"], ["height", "150%"]]) filter.setAttribute(k, v);
    const blur = document.createElementNS(NS, "feGaussianBlur");
    blur.setAttribute("stdDeviation", "0 0");
    filter.appendChild(blur);
    holder.appendChild(filter);
    document.body.appendChild(holder);
    el._mb = { id: filter.id, blur, frame: 0 };
  }
  const mb = el._mb;
  cancelAnimationFrame(mb.frame);
  const start = performance.now();
  el.style.filter = `url(#${mb.id})`;
  const step = (now) => {
    const k = Math.min(1, (now - start) / ms);
    const eased = 1 - Math.pow(1 - k, 3);
    const y = amount * (opening ? 1 - eased : eased);
    mb.blur.setAttribute("stdDeviation", "0 " + y.toFixed(2));
    if (k < 1) mb.frame = requestAnimationFrame(step);
    else el.style.filter = ""; // at rest: no filter at all (sharp, and no cost)
  };
  mb.frame = requestAnimationFrame(step);
}

// ---------------- islands ----------------
let openIsland = null;
function placeIsland(island, anchor, align) {
  const root = $("root").getBoundingClientRect();
  const a = anchor.getBoundingClientRect();
  const w = island.offsetWidth;
  let x = align === "center" ? a.left + a.width / 2 - w / 2 : a.left;
  x = Math.max(8, Math.min(x, root.width - w - 8));
  const top = a.bottom + 4;
  island.style.left = x + "px";
  island.style.top = top + "px";
  island.style.maxHeight = Math.max(120, root.height - top - 10) + "px";
}
function openIslandAt(island, anchor, align, build) {
  if (openIsland === island) { closeIslands(); return; }
  closeIslands();
  build(island);
  placeIsland(island, anchor, align);
  island.classList.add("open");
  motionBlur(island, true);
  openIsland = island;
  $("shield").classList.add("on");
}
// A right-click menu over a field of a side panel (Notebook, Extensions…): closing that menu leaves
// the panel open under it.
let ctxOver = null;
// A click anywhere in that panel outside the small island closes the island (only that: the click
// does nothing else, as a click beside any menu); the panel stays.
let swallowClick = false;
document.addEventListener("mousedown", (e) => {
  if (!ctxOver || !openIsland || openIsland === ctxOver) return;
  if (openIsland.contains(e.target) || !ctxOver.contains(e.target)) return;
  e.preventDefault(); e.stopPropagation();
  swallowClick = true;
  setTimeout(() => { swallowClick = false; }, 600);   // (no click came: a drag)
  closeIslands();
}, true);
document.addEventListener("click", (e) => {
  if (!swallowClick) return;
  swallowClick = false;
  e.preventDefault(); e.stopPropagation();
}, true);
function closeIslands() {
  const keep = ctxOver;
  ctxOver = null;
  document.querySelectorAll(".island.open").forEach((i) => { if (i !== keep) { i.classList.remove("open"); motionBlur(i, false); } });
  openIsland = keep;
  $("shield").classList.toggle("on", !!keep);
  closeSide();
}

// a small island beside the Preferences island (search engine, site theme): it opens when the
// mouse rests on its row (or on a click), next to that row, and fits into the window too
let sideOwner = null;
let sideHide = 0;
// The side island closes by itself, with nothing chosen, once the mouse is neither on its row

function closeSideSoon() {

  sideHide = setTimeout(closeSide, 260);
}

$("sideIsland").addEventListener("mouseleave", closeSideSoon);

  clearTimeout(sideHide);

  $("sideIsland").classList.remove("open");
  if (sideOwner) sideOwner.classList.remove("active");
  sideOwner = null;
}
function openSide(row, build) {
  const side = $("sideIsland");
  if (sideOwner === row && side.classList.contains("open")) return;
  closeSide();
  build(side);
  const root = $("root").getBoundingClientRect();
  const main = $("prefsIsland").getBoundingClientRect();
  const r = row.getBoundingClientRect();
  side.style.maxHeight = (root.height - 20) + "px";
  const w = side.offsetWidth, h = side.offsetHeight;
  // to the right, where the arrows point; to the left only when the window is too narrow there
  let x = main.right + 6;
  if (x + w > root.width - 8) x = main.left - w - 6;
  if (x < 8) x = Math.max(8, root.width - w - 8);
  const top = Math.max(8, Math.min(r.top - 6, root.height - h - 10));
  side.style.left = x + "px";
  side.style.top = top + "px";
  row.classList.add("active");
  sideOwner = row;
  side.classList.add("open");
  motionBlur(side, true);
}
function subItem(text, value, build) {
  const el = document.createElement("div");
  el.className = "item sub";
  el.innerHTML = `<span class="mark"></span><span>${esc(text)}</span><span class="val">${esc(value)}</span>${svg("forward")}`;
  let timer = 0;
  el.addEventListener("mouseenter", () => {
    clearTimeout(timer);
    if (sideOwner === el) clearTimeout(sideHide); // back on its own row: it stays
    else timer = setTimeout(() => openSide(el, build), 140);
  });
  el.addEventListener("mouseleave", () => { clearTimeout(timer); if (sideOwner === el) closeSideSoon(); });
  el.onclick = () => { clearTimeout(timer); openSide(el, build); };
  return el;
}
function item(text, { icon, on, key, act, keep } = {}) {
  const el = document.createElement("div");
  el.className = "item" + (on ? " on" : "");
  el.innerHTML = (icon ? svg(icon) : `<span class="mark"></span>`) + `<span>${esc(text)}</span>` +
    (key ? `<span class="key">${esc(key)}</span>` : "");
  el.addEventListener("mouseenter", () => { if (sideOwner && !el.closest("#sideIsland")) closeSide(); });
  el.onclick = () => {
    if (act) act();
    if (keep) { if (openIsland) openIsland.dispatchEvent(new Event("rebuild")); }

}
const head = (text) => Object.assign(document.createElement("div"), { className: "head", textContent: text });
const hr = () => Object.assign(document.createElement("div"), { className: "hr" });

function buildPlaces(island) {
  if (INIT.standalone) {   // Browser-17 on its own: Player-17 opens (music, video and radio are inside)
    island.replaceChildren(item("Open Player-17", { icon: "music", act: () => P.send({ ev: "goto", where: "music" }) }));
    return;
  }
  island.replaceChildren(
    item("Music player", { icon: "music", act: () => P.send({ ev: "goto", where: "music" }) }),
    item("Video player", { icon: "video", act: () => P.send({ ev: "goto", where: "video" }) }),
    item("Radio", { icon: "radio", act: () => P.send({ ev: "goto", where: "radio" }) }),

}
const THEME_NAMES = [["auto", "As the system"], ["dark", "Dark"], ["light", "Light"]];
function buildEngines(side) {

    state.engine = key;

}
function buildThemes(side) {

    P.send({ ev: "set", key: "web_site_theme", value: key });
  } })));

      const text = document.body ? lum(getComputedStyle(document.body).color) : null;
      if (root < 0.45 || mid < 0.45 || (text !== null && text > 0.6)) return;   // already dark
      const st = document.createElement("style");
      st.id = ID;
      st.textContent = ${JSON.stringify(css)};
      (document.head || document.documentElement).append(st);
    };
    check();
    if (document.readyState !== "complete") addEventListener("load", () => setTimeout(check, 300), { once: true });
  })()`).catch(() => {});
}

// the translation of a selected text, in an island where it was selected
async function showTranslation(text, x, y, to) {
  const lang = to || PL.translate.to;
  const island = $("trIsland");
  const build = (body, from) => {
    const bar = el("div", "bar");
    bar.append(el("div", "name", "Translator 17"));
    const sel = el("select");
    for (const [c, n] of TR_LANGS) sel.append(Object.assign(document.createElement("option"), { value: c, textContent: n, selected: c === lang }));
    sel.onchange = () => { plSet("translate", { to: sel.value }); showTranslation(text, x, y, sel.value); };
    bar.append(sel);
    const out = el("div", "out");
    out.textContent = body;
    const foot = el("div", "foot");
    foot.append(el("div", "from", from ? esc(trLangName(from) + " → " + trLangName(lang)) : ""));
    const copy = el("button", "", "Copy");
    copy.onclick = () => { P.nb.copy(body, false); notice("Translation copied"); };
    if (from) foot.append(copy);
    island.replaceChildren(bar, out, foot);
  };
  openIslandAtPoint(island, x, y, () => build("Translating…", ""));
  const r = await P.pl.translate(text, lang, PL.translate.from || "auto");
  if (openIsland !== island) return;   // closed meanwhile
  build(r.ok ? r.text : "Couldn't translate: " + r.error, r.ok ? r.from : "");
}
