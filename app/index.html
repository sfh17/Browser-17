// ---------------- Extensions (a trial): Chrome extensions in the pages ----------------
const EXT = { list: [], busy: false, view: null, tab: "own" };   // tab: "own" (our plugins) or "chrome"   // view: an extension's own window (its popup / options)
async function openExtensions() {
  if (!openRightPanel($("extPanel"))) return;
  EXT.view = null;
  EXT.list = await P.ext.list();
  extRender();
}
async function extDo(promise, done) {
  EXT.busy = true; extRender();
  const r = await promise;
  EXT.busy = false;
  EXT.list = r.list || EXT.list;
  if (!r.ok) notice("Extension: " + r.error);
  else if (done) notice(done);
  extRender();
}
function extRender() {
  const panel = $("extPanel");
  if (EXT.view && EXT.view.url) {   // the extension's own window, inside the island
    const bar = el("div", "bar");
    bar.append(iconBtn("back", "Back to the list", () => { EXT.view = null; extRender(); }),
      el("div", "title", esc(EXT.view.name)));
    const wv = document.createElement("webview");
    wv.setAttribute("allowpopups", "");   // (its links and window.open become tabs, as in pages)
    wv.src = EXT.view.url;
    // Electron has no chrome.tabs.create / chrome.windows.create: an extension's window uses them to
    // open its sign-in page and the like. Here they open a tab of the browser (window.open → a tab).
    wv.addEventListener("dom-ready", () => wv.executeJavaScript(`(() => {
      const c = window.chrome; if (!c) return;
      const open = (o, cb) => {
        const u = o && o.url ? new URL(Array.isArray(o.url) ? o.url[0] : o.url, location.href).href : "";
        if (u) window.open(u, "_blank");
        const t = { id: -1, url: u };
        if (typeof cb === "function") setTimeout(() => cb(t), 0);
        return Promise.resolve(t);
      };
      c.tabs = c.tabs || {}; c.windows = c.windows || {};
      for (const [o, k] of [[c.tabs, "create"], [c.windows, "create"]]) {
        try { o[k] = open; } catch (e) {}
        if (o[k] !== open) try { Object.defineProperty(o, k, { value: open, configurable: true }); } catch (e) {}
      }
    })()`).catch(() => {}));
    panel.replaceChildren(bar, wv);
    return;
  }
  const top = el("div", "top");
  top.append(el("div", "title", "Extensions"));
  const tabsSeg = el("div", "seg");
  for (const [k, name] of [["own", "Own plugins"], ["chrome", "Chrome"]]) {
    const b = el("button", EXT.tab === k ? "on" : "", esc(name));
    b.onclick = () => { EXT.tab = k; EXT.view = null; extRender(); };
    tabsSeg.append(b);
  }
  top.append(tabsSeg);
  if (EXT.tab === "own") { panel.replaceChildren(top, ...ownPlugins()); return; }
  const fromFolder = el("button", "act", "From folder");
  fromFolder.title = "An unpacked extension: a folder with manifest.json";
  fromFolder.onclick = async () => {
    holdIslands = true;   // the panel waits while the folder is chosen
    try { await extDo(P.ext.folder(), "Extension added. Reload the page to see it work"); }
    finally { holdIslands = false; }
  };
  const add = el("div", "bar");
  const link = el("input");
  link.placeholder = "Chrome Web Store link";
  link.spellcheck = false;
  // on an extension's page in the store: its link is already here
  const here = urlOf(current);
  if (!link.value && /chromewebstore\.google\.com\/detail\/|chrome\.google\.com\/webstore\/detail\//.test(here)) link.value = here;
  const go = el("button", "act", EXT.busy ? "…" : "Add");
  const install = () => { if (link.value.trim()) extDo(P.ext.store(link.value.trim()), "Extension added. Reload the page to see it work"); };
  go.onclick = install;
  link.onkeydown = (e) => { if (e.key === "Enter") install(); };
  add.append(link, go);
  const store = el("div", "add", svg("puzzle") + "<span>Open Chrome Web Store</span>");
  store.title = "Find an extension there, open its page, then come back here: its link is filled in";
  store.onclick = () => { closeIslands(); newTab("https://chromewebstore.google.com/"); notice("Open an extension's page, then ☰ → Extensions → Add"); };
  const hint = el("div", "hint", "A trial: extensions that change pages mostly work. Ad blockers of the new kind (uBlock Origin Lite) don't.");
  const list = el("div", "list");
  for (const x of EXT.list) {
    const row = el("div", "row");
    row.append(x.icon ? Object.assign(el("img", "ico"), { src: x.icon }) : el("span", "ico none"));
    row.append(el("div", "txt", `<div class="t1">${esc(x.name)}</div><div class="t2">${esc(x.error ? "Not loaded: " + x.error
      : [x.version && "v" + x.version, x.mv === 3 ? "MV3" : "MV2", x.description].filter(Boolean).join(" · "))}</div>`));
    if (x.enabled && x.popup) row.append(iconBtn("forward", "Open its window", () => { EXT.view = { name: x.name, url: x.popup }; extRender(); }));
    if (x.enabled && x.options) row.append(iconBtn("gear", "Its settings", () => { EXT.view = { name: x.name, url: x.options }; extRender(); }));
    const onOff = el("button", "act" + (x.enabled ? " on" : ""), x.enabled ? "On" : "Off");
    onOff.title = x.enabled ? "Switch off" : "Switch on";
    onOff.onclick = (e) => { e.stopPropagation(); extDo(P.ext.enable(x.id, !x.enabled), "Reload the page to apply"); };
    row.append(onOff);
    const del = iconBtn("trash", "Remove", () => {
      if (!del.classList.contains("armed")) { del.classList.add("armed"); del.title = "Click again to remove"; notice("Click the bin again to remove " + x.name); return; }
      extDo(P.ext.remove(x.id), "Removed: " + x.name);
    });
    row.append(del);
    list.append(row);
  }
  if (!EXT.list.length) list.append(el("div", "empty", "No extensions yet. Paste a Chrome Web Store link above."));
  const chromeTop = el("div", "bar");
  chromeTop.append(el("div", "grow"), fromFolder);
  panel.replaceChildren(top, chromeTop, add, store, hint, list);
}

// On an extension's page in the Chrome Web Store (which hides its own button outside Chrome):
// our "Add to Browser-17" button. It opens https://player17.local/ext-install?url=…, which the
// main process hands to this page (the "local" links) instead of loading it.
const STORE_PAGE = /^https:\/\/(chromewebstore\.google\.com\/detail\/|chrome\.google\.com\/webstore\/detail\/)/;
function storeButton(tab) {
  const url = urlOf(tab);
  const css = getComputedStyle(document.documentElement);
  const c = (n, d) => (css.getPropertyValue(n).trim() || d);
  const solid = (v) => /^#[0-9a-f]{8}$/i.test(v) ? v.slice(0, 7) : /^#[0-9a-f]{4}$/i.test(v) ? v.slice(0, 4) : v;   // no see-through
  const look = { bg: solid(c("--bg", "#000")), text: solid(c("--title", "#fff")), line: solid(c("--lines", "#ff0080")),
    label: (INIT.standalone ? "Add to Browser-17" : "Add to Player-17 browser") };
  const js = `(() => {
    const on = ${JSON.stringify(STORE_PAGE.source)};
    let b = document.getElementById("__b17add");
    if (!new RegExp(on).test(location.href)) { if (b) b.remove(); return; }
    if (!b) {
      b = document.createElement("div");   // (not a link: "open links in a new tab" would take it)
      b.id = "__b17add";
      b.setAttribute("role", "button");
      b.addEventListener("click", (e) => {
        e.preventDefault(); e.stopPropagation();
        location.assign("https://player17.local/ext-install?url=" + encodeURIComponent(location.href));
      }, true);
      document.documentElement.append(b);
    }
    const L = ${JSON.stringify(look)};
    b.textContent = "+  " + L.label;
    b.style.cssText = "position:fixed;right:24px;bottom:24px;z-index:2147483647;padding:12px 22px;border-radius:24px;" +
      "font:600 16px system-ui,sans-serif;text-decoration:none;cursor:pointer;background:" + L.bg + ";color:" + L.text +
      ";border:2px solid " + L.line + ";box-shadow:0 0 14px " + L.line + "88";
  })()`;
  if (STORE_PAGE.test(url) || tab.storeBtn) {
    tab.storeBtn = STORE_PAGE.test(url);
    tab.wv.executeJavaScript(js).catch(() => {});
  }
}

// ---------------- Downloads: what was downloaded, where it is ----------------
const DL = { list: [] };
const dlSize = (b) => !b ? "" : b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + " KB"
  : b < 1024 ** 3 ? (b / 1024 / 1024).toFixed(1) + " MB" : (b / 1024 ** 3).toFixed(2) + " GB";
async function openDownloads() {
  if (!openRightPanel($("dlPanel"))) return;
  DL.list = await P.dl.list();
  dlRender();
}
P.on("downloads", (list) => { DL.list = list || []; if (openIsland === $("dlPanel")) dlRender(); });
function dlRender() {
  const top = el("div", "top");
  top.append(el("div", "title", "Downloads"));
  const folder = el("button", "act", "Open folder");
  folder.onclick = () => P.win({ action: "downloads" });
  top.append(folder);
  if (DL.list.some((d) => d.state !== "progressing" && d.state !== "paused")) {
    const clear = el("button", "act", "Clear list");
    clear.title = "Only the list: the files stay";
    clear.onclick = () => P.dl.act("clear");
    top.append(clear);
  }
  const list = el("div", "list");
  for (const d of DL.list) {
    const going = d.state === "progressing" || d.state === "paused";
    const pct = d.total ? Math.floor(d.received * 100 / d.total) : 0;
    const sub = going ? (d.state === "paused" ? "Paused · " : "") + (d.total ? pct + "% · " + dlSize(d.received) + " of " + dlSize(d.total) : dlSize(d.received))
      : d.state === "completed" ? [dlSize(d.total || d.received), nbDate(d.t)].filter(Boolean).join(" · ")
      : d.state === "cancelled" ? "Cancelled" : "Failed";
    const row = el("div", "row" + (d.state === "completed" ? " done" : "") + (going || d.state === "completed" ? "" : " off"));
    const txt = el("div", "txt", `<div class="t1">${esc(d.name)}</div><div class="t2">${esc(sub)}</div>`);
    if (going) txt.append(el("div", "prog", `<i style="width:${pct}%"></i>`));
    row.append(txt);
    if (going) {
      row.append(d.state === "paused" ? iconBtn("play", "Go on", () => P.dl.act("resume", d.id))
        : iconBtn("pause", "Pause", () => P.dl.act("pause", d.id)),
        iconBtn("close", "Cancel", () => P.dl.act("cancel", d.id)));
    } else {
      row.append(iconBtn("folder", "Show in folder", () => P.dl.act("show", d.id)),
        iconBtn("close", "Remove from the list (the file stays)", () => P.dl.act("remove", d.id)));
    }
    if (d.state === "completed") { row.title = "Open"; row.onclick = () => P.dl.act("open", d.id); }
    list.append(row);
  }
  if (!DL.list.length) list.append(el("div", "empty", "Nothing downloaded yet"));
  $("dlPanel").replaceChildren(top, list);
}

async function openNotes() {
  const panel = $("notesPanel");
  if (!openRightPanel(panel)) return;
  if (!NB.book && !NB.loading) {
    NB.loading = true;
    NB.error = "";
    nbRender();
    const r = await P.nb.load();
    NB.loading = false;
    if (r.ok) NB.book = r.book; else NB.error = r.error;
  }
  nbRender();
}

function nbRender() {
  const panel = $("notesPanel");
  const top = el("div", "top");
  top.append(el("div", "title", "Notebook"));
  const seg = el("div", "seg");
  for (const [k, name] of [["notes", "Notes"], ["logins", "Passwords"]]) {
    const b = el("button", NB.tab === k ? "on" : "", esc(name));
    b.onclick = () => { NB.tab = k; NB.view = "list"; NB.cur = null; NB.q = ""; nbRender(); };
    seg.append(b);
  }
  top.append(seg);
  const parts = [top];
  if (NB.loading) parts.push(el("div", "msg", "Opening… (the system keyring may ask to unlock)"));
  else if (!NB.book && NB.error === "wrong-key") {
    const again = el("button", "act", "Start a new notebook");
    again.onclick = async () => {
      const r = await P.nb.reset();
      if (r.ok) { NB.book = r.book; NB.error = ""; notice("A new notebook. The old file is kept aside in notebook-17"); }
      nbRender();
    };
    parts.push(el("div", "msg err", "This notebook was saved with another key and can't be opened here."),
      el("div", "msg", "Start a new one: the old file is not deleted, it stays next to it (notebook.enc.unreadable-…)."),
      el("div", "bar", "").appendChild(again).parentNode);
  } else if (!NB.book) parts.push(el("div", "msg err", esc("Can't open the notebook: " + NB.error)),
    el("div", "msg", "It needs the system keyring (GNOME Keyring or KWallet)."));
  else if (NB.tab === "notes") parts.push(...(NB.view === "edit" ? nbNoteEdit() : nbNoteList()));
  else parts.push(...(NB.view === "edit" ? nbLoginEdit() : nbLoginList()));
  panel.replaceChildren(...parts);
}

function nbSearch(placeholder) {
  const q = el("input");
  q.placeholder = placeholder;
  q.value = NB.q;
  q.spellcheck = false;
  q.oninput = () => { NB.q = q.value; const pos = q.selectionStart; nbRender();
    const n = $("notesPanel").querySelector("input"); n.focus(); n.setSelectionRange(pos, pos); };
  return q;
}

function nbNoteList() {
  const add = el("div", "add", svg("plus") + "<span>New note</span>");
  add.onclick = () => {
    const n = { id: nbId(), text: "", t: Date.now() };
    NB.book.notes.unshift(n);
    NB.cur = n.id; NB.view = "edit"; nbRender();
  };
  const list = el("div", "list");
  const q = NB.q.trim().toLowerCase();
  const notes = NB.book.notes.filter((n) => !q || n.text.toLowerCase().includes(q)).sort((a, b) => b.t - a.t);
  for (const n of notes) {
    const lines = n.text.trim().split("\n");
    const row = el("div", "row", `<div class="txt"><div class="t1">${esc(lines[0] || "Empty note")}</div>` +
      `<div class="t2">${esc(nbDate(n.t) + (lines[1] ? " · " + lines[1] : ""))}</div></div>`);
    row.onclick = () => { NB.cur = n.id; NB.view = "edit"; nbRender(); };
    list.append(row);
  }
  if (!notes.length) list.append(el("div", "empty", q ? "Nothing found" : "No notes yet"));
  return [nbSearch("Search notes"), add, list];
}

function nbNoteEdit() {
  const n = NB.book.notes.find((x) => x.id === NB.cur);
  if (!n) { NB.view = "list"; return nbNoteList(); }
  const bar = el("div", "bar");
  bar.append(iconBtn("back", "Back to the list", () => nbLeaveNote(n)), el("div", "grow"));
  const del = el("button", "act", "Delete");
  del.onclick = () => {
    if (!del.classList.contains("warn")) { del.classList.add("warn"); del.textContent = "Delete for good?"; return; }
    NB.book.notes = NB.book.notes.filter((x) => x !== n);
    nbSaveSoon(); NB.view = "list"; nbRender();
  };
  bar.append(del);
  const ta = el("textarea");
  ta.placeholder = "Write here. The first line is the title.";
  ta.value = n.text;
  ta.oninput = () => { n.text = ta.value; n.t = Date.now(); nbSaveSoon(); };
  setTimeout(() => ta.focus(), 50);
  return [bar, ta];
}
function nbLeaveNote(n) {
  if (!n.text.trim()) { NB.book.notes = NB.book.notes.filter((x) => x !== n); nbSaveSoon(); }   // an empty note is not kept
  NB.view = "list"; NB.cur = null; nbRender();
}

function nbLoginList() {
  const add = el("div", "add", svg("plus") + "<span>Add a password</span>");
  add.onclick = () => {
    const l = { id: nbId(), site: nbHost(urlOf(current)), user: "", pass: "", note: "", t: Date.now(), fresh: true };
    NB.cur = l; NB.view = "edit"; nbRender();
  };
  const list = el("div", "list");
  const q = NB.q.trim().toLowerCase();
  const here = nbHost(urlOf(current));
  const logins = NB.book.logins.filter((l) => !q || (l.site + " " + l.user + " " + l.note).toLowerCase().includes(q))
    .sort((a, b) => (b.site === here) - (a.site === here) || a.site.localeCompare(b.site));
  for (const l of logins) {
    const row = el("div", "row", `<div class="txt"><div class="t1">${esc(l.site || "—")}${l.site && l.site === here ? " ·  this site" : ""}</div>` +
      `<div class="t2">${esc(l.user || "")}</div></div>`);
    row.append(iconBtn("user", "Copy the login", () => { P.nb.copy(l.user, false); notice("Login copied"); }),
      iconBtn("key", "Copy the password (cleared in 30 s)", () => { P.nb.copy(l.pass, true); notice("Password copied: it leaves the clipboard in 30 s"); }));
    row.onclick = () => { NB.cur = l; NB.view = "edit"; nbRender(); };
    list.append(row);
  }
  if (!logins.length) list.append(el("div", "empty", q ? "Nothing found" : "No passwords yet"));
  return [nbSearch("Search sites and logins"), add, list];
}

function nbLoginEdit() {
  const l = NB.cur;
  if (!l) { NB.view = "list"; return nbLoginList(); }
  const d = { site: l.site, user: l.user, pass: l.pass, note: l.note };   // edited copy: saved on "Save"
  const bar = el("div", "bar");
  bar.append(iconBtn("back", "Back (not saved)", () => { NB.view = "list"; NB.cur = null; nbRender(); }), el("div", "grow"));
  if (!l.fresh) {
    const del = el("button", "act", "Delete");
    del.onclick = () => {
      if (!del.classList.contains("warn")) { del.classList.add("warn"); del.textContent = "Delete for good?"; return; }
      NB.book.logins = NB.book.logins.filter((x) => x !== l);
      nbSaveSoon(); NB.view = "list"; NB.cur = null; nbRender();
    };
    bar.append(del);
  }
  const ok = el("button", "act", "Save");
  ok.style.borderColor = "var(--lines)";
  ok.onclick = () => {
    if (!d.site.trim() && !d.user.trim() && !d.pass) { notice("Nothing to save"); return; }
    Object.assign(l, { site: d.site.trim(), user: d.user.trim(), pass: d.pass, note: d.note, t: Date.now() });
    if (l.fresh) { delete l.fresh; NB.book.logins.push(l); }
    nbSaveSoon(); NB.view = "list"; NB.cur = null; nbRender(); notice("Saved");
  };
  bar.append(ok);
  const field = (label, key, attrs = {}) => {
    const i = el("input");
    Object.assign(i, { value: d[key], spellcheck: false }, attrs);
    i.oninput = () => { d[key] = i.value; };
    return [el("div", "lab", esc(label)), i];
  };
  const [ls, site] = field("Site", "site", { placeholder: "example.com" });
  const [lu, user] = field("Login", "user", { placeholder: "name or e-mail", autocomplete: "off" });
  const [lp, pass] = field("Password", "pass", { type: "password", autocomplete: "new-password" });
  const pw = el("div", "pw");
  pw.append(pass,
    iconBtn("eye", "Show / hide", () => { pass.type = pass.type === "password" ? "text" : "password"; }),
    iconBtn("dice", "Make a strong password", () => { d.pass = pass.value = nbGenerate(); pass.type = "text"; }),
    iconBtn("copy", "Copy the password (cleared in 30 s)", () => { P.nb.copy(pass.value, true); notice("Password copied: it leaves the clipboard in 30 s"); }));
  const note = el("textarea");
  note.placeholder = "Note (optional)";
  note.value = d.note;
  note.style.minHeight = "80px";
  note.oninput = () => { d.note = note.value; };
  const form = el("div", "form");
  form.append(ls, site, lu, user, lp, pw, note);
  setTimeout(() => (l.fresh && site.value ? user : site).focus(), 50);
  return [bar, form];
}

// ---------------- messages ----------------
let toastMark = 0;
function notice(text, onClick) {
  const toast = $("toast");
  const mark = ++toastMark;
  if (!text) { toast.classList.remove("on"); return; }
  toast.textContent = text;
  toast.classList.toggle("link", !!onClick);
  toast.onclick = onClick || null;
  if (!toast.classList.contains("on")) motionBlur(toast, true);
  toast.classList.add("on");
  setTimeout(() => { if (toastMark === mark) toast.classList.remove("on"); }, onClick ? 5000 : 3000);
}

// ---------------- shortcuts (also while a page has the keyboard: they come from the main process) ----------------
const SHORTCUTS = {
  "Ctrl+t": () => { newTab(); $("address").focus(); },
  "Ctrl+Shift+k": () => openNotes(),
  "Ctrl+w": () => closeTab(current),
  "Ctrl+l": () => { $("address").focus(); $("address").select(); },
  "Ctrl+r": () => $("reload").click(),
  "F5": () => $("reload").click(),
  "Alt+ArrowLeft": () => $("back").click(),
  "Alt+ArrowRight": () => $("forward").click(),
  "Ctrl+Tab": () => stepTab(1), "Ctrl+PageDown": () => stepTab(1),
  "Ctrl+Shift+Tab": () => stepTab(-1), "Ctrl+PageUp": () => stepTab(-1),
  "Ctrl+j": () => openDownloads(),
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeIslands(); return; }
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const combo = (e.ctrlKey || e.metaKey ? "Ctrl+" : "") + (e.altKey ? "Alt+" : "") + (e.shiftKey ? "Shift+" : "") + key;
  if (SHORTCUTS[combo]) { e.preventDefault(); SHORTCUTS[combo](); }
});
P.on("key", (combo) => { if (SHORTCUTS[combo]) SHORTCUTS[combo](); });
// the browser's own addresses (https://player17.local/...) are commands, never pages: also when a
// site's link would open them in a new tab
P.on("open-tab", (url) => String(url).startsWith("https://player17.local/") ? handleLocal(url) : newTab(url, true));
P.on("maxed", (on) => document.documentElement.classList.toggle("maxed", !!on));
P.on("local", (url) => handleLocal(url));
function handleLocal(url) {
  let u;
  try { u = new URL(url); } catch (e) { return; }
  const q = u.searchParams;
  if (u.pathname === "/unpin") {  // (older start pages still open in a tab)
    const target = q.get("url");
    state.pinned = state.pinned.filter((p) => p.url !== target);
    saveStartLists("own");
  } else if (u.pathname === "/save" || u.pathname === "/remove") {
    // a tile of the start page: added, edited or removed
    const own = q.get("list") !== "music";
    const list = own ? state.pinned : state.sites;
    const i = parseInt(q.get("i"), 10);
    if (u.pathname === "/remove") {
      if (i >= 0 && i < list.length) list.splice(i, 1);
    } else {
      let url;
      try { url = new URL(q.get("url") || ""); } catch (e) { return; }
      if (!/^https?:$/.test(url.protocol)) return;
      const entry = { title: (q.get("title") || "").trim() || url.hostname.replace(/^www[.]/, ""), url: url.href.replace(/[/]$/, "") };
      if (i >= 0 && i < list.length) list[i] = entry;
      else list.push(entry);
    }
    saveStartLists(own ? "own" : "music");
  } else if (u.pathname === "/translate-page") {   // the button on a page (Translator 17)
    translatePage(current);
  } else if (u.pathname === "/ext-install") {   // the button on a Chrome Web Store page
    const target = q.get("url") || "";
    notice("Adding the extension…");
    P.ext.store(target).then((r) => {
      const x = r.ok ? (r.list || []).find((e) => e.id === r.id) : null;
      notice(r.ok ? `Added: ${x ? x.name : "the extension"}. Reload a page to see it work` : "Extension: " + r.error);
      if (openIsland === $("extPanel")) { EXT.list = r.list || EXT.list; extRender(); }
    });
  } else if (u.pathname === "/restore") {
    state.sites = DEFAULT_SITES.map((p) => ({ ...p }));
    state.sitesChanged = false;
    P.send({ ev: "set", key: "web_sites", value: null });
    refreshStartPages();
  }
}
function saveStartLists(which) {
  if (which === "own") {
    P.send({ ev: "set", key: "web_pinned", value: state.pinned });
    showAddress();  // the star follows
  } else {
    state.sitesChanged = true;
    P.send({ ev: "set", key: "web_sites", value: state.sites });
  }
  refreshStartPages();
}
P.on("download", (d) => {
  if (d.state === "started") notice(`Downloading: ${d.name}`);
  else if (d.state === "completed") notice(`Saved: ${d.name}  (click: show in folder)`, () => P.win({ action: "show-file", file: d.file }));
  else notice(`Download failed: ${d.name}`);
});
// the player's commands: pause / play scripts, messages, colors
let colorsTimer = 0;
P.on("cmd", (cmd) => {
  if (cmd.cmd === "colors") {  // Color and background in the player: shown here at once
    setColors(cmd.colors);
    if (cmd.frame !== undefined) document.documentElement.classList.toggle("framed", !!cmd.frame);
    clearTimeout(colorsTimer);
    colorsTimer = 0;  // (the start page follows the colors by itself)
  } else if (cmd.cmd === "restart") {  // solid <-> see-through: the window is made again
    P.send({ ev: "restart", tabs: tabs.filter((t) => !t.pinned && !onStart(t)).map(urlOf).filter(Boolean) });
  } else if (cmd.cmd === "js") {
    for (const tab of tabs) tab.wv.executeJavaScript(cmd.script || "").catch(() => {});
  } else if (cmd.cmd === "notice") {
    notice(cmd.text || "");
  } else if (cmd.cmd === "rate") {   // the sample rate was chosen in the Plugins window
    state.rate = String(cmd.value || "auto");
  } else if (cmd.cmd === "sound") {   // Browser-17 on its own: the sound helper's state
    onSoundStatus(!!cmd.ok, cmd.text || "");
  }
});

// the links script goes into every page once it is ready (and Dark 17's look)
$("views").addEventListener("dom-ready", (e) => {
  const tab = tabs.find((t) => t.wv === e.target);
  if (tab) { applyLinks(tab); applyDark(tab); }
}, true);

// ---------------- start ----------------
setColors(C);
renderStart();
showTabs(state.tabsShown, false);
const pinnedAtStart = (INIT.pinned_tabs || []).filter((u) => typeof u === "string" && u);
const reopen = (INIT.open_tabs || []).filter((u) => u && !pinnedAtStart.includes(u));
// tabs brought back sleep until opened (no sound, no load); only the last one is shown and loads now
for (const url of pinnedAtStart) newTab(url, false, true, true);
if (reopen.length) reopen.forEach((url, i) => newTab(url, i === reopen.length - 1, false, i < reopen.length - 1));
else newTab();
</script>
<script src="standalone-ui.js"></script>
